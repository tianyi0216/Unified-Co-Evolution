# UCoE (Unified Co-Evolution) — default configuration
# Reproduces the paper's Arena-Hard headline cell with the Qwen3-8B actor: Table "Open-ended preference
# against matched direct generation", block Qwen3-8B, row UCoE, column Arena-Hard (58.30; Direct
# Generation is 50.00 by construction). The paper's Arena-Hard Qwen3-8B run is the contract-only
# configuration: three reference contrast families, relation discovery disabled.
#
# Override any field by editing this file or by passing a different YAML path to the launchers:
#   bash process_data.sh configs/wildbench_qwen8b.yaml
#   bash run_ucoe.sh     configs/wildbench_qwen8b.yaml [all|raw|discover|banks|run|status]
#   bash eval.sh         configs/wildbench_qwen8b.yaml [preference|native|all] [ucoe]
# ${a.b.c} references to other keys are interpolated when the file is loaded.

# ---------------------------------------------------------------------------
# Benchmark — which frozen task stream to deploy on
# ---------------------------------------------------------------------------
benchmark:
  name: arena_hard                     # arena_hard | writingprompts | wildbench | writingbench |
                                       # multichallenge | refinebench | ifbench | hard_math | bigcodebench
  data_dir: data/processed/arena_hard  # written by process_data.sh (tasks, calibration pool, evaluation sidecar)
  n_tasks: 500                         # deployment tasks to run, in the frozen order (Arena-Hard: all 500)
  seed: 42                             # seed namespace for every deterministic draw (bank assignment, shuffles)

# ---------------------------------------------------------------------------
# Models — actor, fixed verifier model, comparison model (relation discovery) and final judge
# ---------------------------------------------------------------------------
models:
  backend: tinker                      # tinker | openai | mock  (mock = offline deterministic transport for tests)
  actor: Qwen/Qwen3-8B                 # policy that drafts and revises (paper: Qwen3-8B or Qwen3.8-27B)
  verifier: Qwen/Qwen3.6-35B-A3B       # synthesizes verifier programs, scores semantic criteria, diagnoses
  comparator: Qwen/Qwen3.8-27B         # larger model answering discovery prompts (Qwen3.5-397B-A17B for the 27B actor)
  judge: Qwen/Qwen3.5-397B-A17B        # final evaluator for preference duels and judge-based native metrics
  openai:                              # used only when backend == openai (OpenAI, Azure, vLLM, any compatible server)
    base_url: null                     # e.g. http://localhost:8000/v1 for a vLLM server; null = the SDK default
    api_key_env: OPENAI_API_KEY        # environment variable holding the key
    extra_body: {}                     # extra request fields forwarded verbatim; {} = none. For a vLLM server give a
                                       # mapping (e.g. {chat_template_kwargs: {}}): the per-call thinking flag is then
                                       # sent as chat_template_kwargs.enable_thinking (OpenAI/Azure reject that field)

# ---------------------------------------------------------------------------
# Decoding — per-stage sampling (paper Table "Default UCoE hyperparameters")
# Values here override the benchmark adapter's suite constants.
# ---------------------------------------------------------------------------
decoding:
  generation: {max_tokens: 4096, temperature: 0.7}   # draft (Direct Generation and memory-guided drafts)
  revision:   {max_tokens: 4096, temperature: 0.7}   # the one local repair per task
  scoring:    {max_tokens: 640, temperature: 0.0}    # semantic criterion scores (verifier model)
  synthesis:  {max_tokens: 6000, temperature: 0.0, thinking: true}   # verifier programs (thinking: Tinker only)
  localize:   {max_tokens: 640, temperature: 0.0}    # diagnosis: witness + one repair instruction
  distill:    {max_tokens: 256, temperature: 0.0}    # procedure distillation into the harness state
  judge:      {max_tokens: 512, temperature: 0.0}    # final-evaluator duels (deterministic)

# ---------------------------------------------------------------------------
# UCoE — verifier synthesis, contrast construction, selection, revision and harness state
# ---------------------------------------------------------------------------
ucoe:
  initial_candidates: 2                # K verifier candidates synthesized before task 0 (slots h0a, h0b, ...)
  candidates_per_checkpoint: 1         # challengers synthesized at each checkpoint (slots ck<i>; ck<i>a, ck<i>b, ...)
  max_new_criteria: 2                  # criteria a candidate may append to the retained set
  eps: 0.01                            # margin for contrast success and for revision acceptance
  checkpoints: [128, 256]              # verifier updates happen before these task indices (each must be < n_tasks)
  regression_tolerance: 0.10           # kappa: a challenger may not drop any existing family by more than this
  update_rule: relative                # relative (paper) | hard (conservative confidence-bound ablation)
  contrasts:
    selection_per_family: 24           # selection-split sources per reference family at every stage
    heldout_per_family: 96             # held-out sources per reference family
    relation_selection_per_family: 12  # same quotas for mined relation families
    relation_heldout_per_family: 24
    chunk: 16                          # sources rendered per assignment step
    floor: 0.8333                      # a family below floor * quota aborts; shortfalls above it are recorded
    reuse_sources_across_stages: false # false = fresh sources for every bank (paper); true = within-stage disjoint only
  relation_discovery:
    enabled: false                     # mine benchmark-specific relation families from actor-vs-comparator pairs
    n_discovery_prompts: 32            # development prompts (excluded from the banks)
    max_pairs: 24                      # response pairs screened for differences
    max_modules: 2                     # relation modules kept, by support
    min_recurrence: 3                  # a relation must recur in at least this many prompts
  memory:                              # bounded procedural memory (the harness state)
    capacity: 12                       # total procedures
    per_dimension: 2                   # procedures per quality dimension
    max_retrieved: 2                   # procedures shown to the actor
    token_cap: 64                      # word budget of the retrieved guidelines
    dedup_jaccard: 0.75                # token-set Jaccard threshold for near duplicates
    at_draft: true                     # retrieve guidelines for the draft as well as for the revision (Algorithm 1);
                                       # false = serve the sealed Direct Generation draft unchanged and retrieve only
                                       # for the revision, as the runs behind the reported tables did

# ---------------------------------------------------------------------------
# Evaluation — preference duels and native metrics (bash eval.sh)
# ---------------------------------------------------------------------------
evaluation:
  judge_both_orders: true              # judge each pair in both presentation orders and merge by sign
  bootstrap: {reps: 50000, block: 64, seed: 42}   # contiguous-block bootstrap for the preference interval
  native:
    evaluator: null                    # null = the benchmark's own metric (ifbench | hard_math | bigcodebench |
                                       # wildbench_score | multichallenge_rubric | refinebench_checklist |
                                       # writingbench_critic)
    # IFBench-only knobs (ignored elsewhere)
    ifbench_primary: loose_prompt_acc  # loose_prompt_acc (Table 2's 34.67 / 30.00) |
                                       # strict_prompt_acc; all four official figures are written
    # Hard-MATH-only
    require_math_verify: false         # true = refuse to score MATH-500 items without the math-verify package
    # BigCodeBench-Hard-only
    bcb_python: null                   # interpreter with the BigCodeBench test dependencies (null = this Python)
    bcb_timeout: 120                   # seconds per solution + test
    bcb_workers: 6                     # parallel subprocesses
    bcb_canonical_check: false         # run the canonical solutions first to validate the environment
    # WritingBench-only: OpenAI-compatible endpoint serving the critic model
    critic:
      base_url: http://localhost:8205/v1
      model: AQuarterMile/WritingBench-Critic-Model-Qwen-7B
      api_key_env: OPENAI_API_KEY

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  work_dir: runs/arena_hard_qwen8b     # raw/ (Direct Generation), ucoe/ (UCoE arm), banks/, relations/, eval/
  workers: 16                          # parallel model calls
  smoke: false                         # true = tiny bank quotas for an end-to-end smoke test
  ceilings:                            # hard caps on new calls per model class; null = unlimited
    actor: null
    verifier: null
    judge: null
    comparator: null
