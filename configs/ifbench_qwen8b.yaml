# UCoE preset: IFBench, Qwen3-8B actor.
# Configuration of the research run behind this cell (the paper does not state it per cell): contract-only,
#   i.e. the three reference families with relation discovery disabled.
# Reproduces Table "Verifiable tasks with Qwen3-8B" (tab:verifiable-performance), row UCoE: IFBench 34.67
#   accuracy (Direct Generation 30.00): prompt-level loose accuracy of the official evaluator (eval.sh native also
#   writes the strict variant and the instruction-level figures) -> bash eval.sh configs/ifbench_qwen8b.yaml native.
# Contrast quotas of that run: 8 selection / 40 held-out sources per reference family, drawn from the
#   150-prompt calibration pool; sources may recur across checkpoints (disjoint within a checkpoint).
#   The paper's hyperparameter table lists the Arena-Hard values (24 / 96, fresh sources at every checkpoint).
# Decoding of that run (the adapter's suite constants, repeated below): drafts at temperature 0.0 (greedy), the local
#   repair at 0.3, distillation 320 tokens; the paper's hyperparameter table lists the Arena-Hard values 0.7 / 0.7.
# Usage: bash process_data.sh configs/ifbench_qwen8b.yaml && bash run_ucoe.sh configs/ifbench_qwen8b.yaml &&
#   bash eval.sh configs/ifbench_qwen8b.yaml
# See config.yaml for the meaning of every key.

benchmark:
  name: ifbench
  data_dir: data/processed/ifbench
  n_tasks: 150
  seed: 42
  protocol: matched

models:
  backend: tinker
  actor: Qwen/Qwen3-8B
  verifier: Qwen/Qwen3.6-35B-A3B
  comparator: Qwen/Qwen3.8-27B
  judge: Qwen/Qwen3.5-397B-A17B
  openai:
    base_url: null
    api_key_env: OPENAI_API_KEY
    extra_body: {}

decoding:
  generation: {max_tokens: 4096, temperature: 0.0}
  revision:   {max_tokens: 4096, temperature: 0.3}
  scoring:    {max_tokens: 640, temperature: 0.0}
  synthesis:  {max_tokens: 6000, temperature: 0.0, thinking: true}
  localize:   {max_tokens: 640, temperature: 0.0}
  distill:    {max_tokens: 320, temperature: 0.0}
  judge:      {max_tokens: 512, temperature: 0.0}

ucoe:
  initial_candidates: 2
  candidates_per_checkpoint: 1
  max_new_criteria: 2
  eps: 0.01
  checkpoints: [48, 96]
  regression_tolerance: 0.10
  update_rule: relative
  contrasts:
    selection_per_family: 8
    heldout_per_family: 40
    relation_selection_per_family: 12
    relation_heldout_per_family: 24
    chunk: 16
    floor: 0.8333
    reuse_sources_across_stages: true
  relation_discovery:
    enabled: false
    n_discovery_prompts: 32
    max_pairs: 24
    max_modules: 2
    min_recurrence: 3
  memory:
    capacity: 12
    per_dimension: 2
    max_retrieved: 2
    token_cap: 64
    dedup_jaccard: 0.75
    at_draft: true

evaluation:
  judge_both_orders: true
  bootstrap: {reps: 50000, block: 64, seed: 42}
  native:
    evaluator: null                    # the benchmark's own metric (see config.yaml)
    ifbench_primary: loose_prompt_acc  # Table 2's figure; strict_prompt_acc selects the strict variant

output:
  work_dir: runs/ifbench_qwen8b
  workers: 16
  smoke: false
  ceilings:
    actor: null
    verifier: null
    judge: null
    comparator: null
